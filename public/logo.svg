<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Arka Plan Radyal ve Doğrusal Gradyanlar -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="55%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#07090E" />
    </radialGradient>

    <!-- Yarış Kırmızısı Gradyan -->
    <linearGradient id="raceRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E3B" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- Metalik Gümüş / Krom -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E5E7EB" />
      <stop offset="70%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>

    <!-- Şampiyonluk Altını -->
    <linearGradient id="paddockGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Neon Cyan Detay -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Hafif İç Gölgelendirme Filtresi -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- 1. Arka Plan (Squircle Köşeli, Mobil Uyumlu) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />

  <!-- Dış Yarış Bordürü -->
  <rect x="12" y="12" width="488" height="488" rx="102" fill="none" stroke="url(#raceRed)" stroke-width="5" stroke-opacity="0.45" />

  <!-- Damalı Bayrak Üst Şeridi (Pist Teması) -->
  <g opacity="0.18">
    <rect x="80" y="32" width="22" height="12" fill="#FFFFFF" />
    <rect x="124" y="32" width="22" height="12" fill="#FFFFFF" />
    <rect x="168" y="32" width="22" height="12" fill="#FFFFFF" />
    <rect x="212" y="32" width="22" height="12" fill="#FFFFFF" />
    <rect x="256" y="32" width="22" height="12" fill="#FFFFFF" />
    <rect x="300" y="32" width="22" height="12" fill="#FFFFFF" />
    <rect x="344" y="32" width="22" height="12" fill="#FFFFFF" />
    <rect x="388" y="32" width="22" height="12" fill="#FFFFFF" />

    <rect x="102" y="44" width="22" height="12" fill="#FFFFFF" />
    <rect x="146" y="44" width="22" height="12" fill="#FFFFFF" />
    <rect x="190" y="44" width="22" height="12" fill="#FFFFFF" />
    <rect x="234" y="44" width="22" height="12" fill="#FFFFFF" />
    <rect x="278" y="44" width="22" height="12" fill="#FFFFFF" />
    <rect x="322" y="44" width="22" height="12" fill="#FFFFFF" />
    <rect x="366" y="44" width="22" height="12" fill="#FFFFFF" />
    <rect x="410" y="44" width="22" height="12" fill="#FFFFFF" />
  </g>

  <!-- 2. PADDOCK BOX KEPENK & GARAJ MİMARİSİ -->
  <g filter="url(#dropShadow)">
    <!-- Garaj Dış Çerçevesi -->
    <path d="M 120 120 L 256 64 L 392 120 L 392 360 L 120 360 Z" fill="#131926" stroke="#252F42" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Çatı Alınlığı (Kırmızı Yarış Üçgeni) -->
    <path d="M 124 122 L 256 68 L 388 122 Z" fill="url(#raceRed)" />

    <!-- Çatı Üstü "UŞAK" Yazısı -->
    <text x="256" y="112" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" font-style="italic" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
      UŞAK PİSTİ
    </text>

    <!-- Kepenk Kapı Alanı -->
    <rect x="146" y="140" width="220" height="200" rx="14" fill="#0A0D14" stroke="#374151" stroke-width="4" />

    <!-- Metalik Kepenk Çizgileri (Paddock Box Ruhu) -->
    <line x1="152" y1="164" x2="360" y2="164" stroke="#1E2638" stroke-width="3" />
    <line x1="152" y1="184" x2="360" y2="184" stroke="#1E2638" stroke-width="3" />
    <line x1="152" y1="204" x2="360" y2="204" stroke="#1E2638" stroke-width="3" />
    <line x1="152" y1="224" x2="360" y2="224" stroke="#1E2638" stroke-width="3" />
    <line x1="152" y1="244" x2="360" y2="244" stroke="#1E2638" stroke-width="3" />
    <line x1="152" y1="264" x2="360" y2="264" stroke="#1E2638" stroke-width="3" />
    <line x1="152" y1="284" x2="360" y2="284" stroke="#1E2638" stroke-width="3" />
    <line x1="152" y1="304" x2="360" y2="304" stroke="#1E2638" stroke-width="3" />
    <line x1="152" y1="324" x2="360" y2="324" stroke="#1E2638" stroke-width="3" />

    <!-- 3. MOTOSİKLET VE YARIŞ SİMGESİ (ORTADA PARLAYAN SİLÜET) -->
    <!-- Şık Yarış Motosikleti İkonu (Vektörel) -->
    <g transform="translate(176, 172) scale(1.7)" filter="url(#dropShadow)">
      <!-- Arka Tekerlek -->
      <circle cx="16" cy="62" r="14" fill="none" stroke="url(#chrome)" stroke-width="4.5" />
      <circle cx="16" cy="62" r="6" fill="#DC2626" />

      <!-- Ön Tekerlek -->
      <circle cx="78" cy="62" r="14" fill="none" stroke="url(#chrome)" stroke-width="4.5" />
      <circle cx="78" cy="62" r="6" fill="#DC2626" />

      <!-- Şasi ve Gövde -->
      <path d="M 16 62 L 34 46 L 54 44 L 78 62" fill="none" stroke="url(#raceRed)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Depo ve Kuyruk -->
      <path d="M 24 44 L 38 32 L 56 34 L 64 44 Z" fill="url(#raceRed)" />
      
      <!-- Ön Grenaj ve Cam -->
      <path d="M 56 34 L 72 32 L 66 48 Z" fill="#FBBF24" />

      <!-- Pilot Kaskı -->
      <circle cx="48" cy="24" r="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="2" />
      <path d="M 49 22 L 55 24 L 52 27 Z" fill="#111827" />

      <!-- Egzoz ve Hız Hattı -->
      <line x1="22" y1="58" x2="38" y2="52" stroke="url(#chrome)" stroke-width="3" stroke-linecap="round" />
      <line x1="2" y1="46" x2="16" y2="46" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
      <line x1="-4" y1="54" x2="10" y2="54" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- 10 PADDOCK BOX ROZETİ (GARAJ NO VURGUSU) -->
    <g transform="translate(196, 320)">
      <rect x="0" y="0" width="120" height="28" rx="8" fill="url(#raceRed)" stroke="#FFFFFF" stroke-width="1.5" />
      <text x="60" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
        10 BOX GARAJ
      </text>
    </g>
  </g>

  <!-- 4. ALT ŞERİT BÜYÜK "PADDOCK" METNİ -->
  <g transform="translate(256, 428)">
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" font-style="italic" fill="url(#chrome)" text-anchor="middle" letter-spacing="6">
      PADDOCK
    </text>
    <text x="0" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="4">
      GARAGE &amp; TRACK SYSTEM
    </text>
  </g>
</svg>