<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Karbon Arka Plan Radyal Gradyan -->
    <radialGradient id="carbonBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1A202C" />
      <stop offset="60%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#06080D" />
    </radialGradient>

    <!-- Yarış Kırmızısı (Ferrari / Ducati / MotoGP Red) -->
    <linearGradient id="apexRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3838" />
      <stop offset="45%" stop-color="#E60000" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <!-- Titanyum Krom Gradyan -->
    <linearGradient id="titaniumChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Altın Apex Gradyan -->
    <linearGradient id="goldApex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Neon Cyan Detay Işıması -->
    <linearGradient id="cyanSpeed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Derinlik ve Işıma Filtreleri -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#E60000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. Dış Squircle Kalkan Gövde (Mobil & Masaüstü İkon Uyumlu) -->
  <rect width="512" height="512" rx="112" fill="url(#carbonBg)" />

  <!-- Dış Karbon Şerit & Lazer Kenarlık -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="url(#apexRed)" stroke-width="4" stroke-opacity="0.4" />
  <rect x="22" y="22" width="468" height="468" rx="92" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1" />

  <!-- Karbon Fiber / Damalı Bayrak Estetik Doku İzleri -->
  <g opacity="0.12">
    <path d="M 0 64 L 512 64 M 0 128 L 512 128 M 0 192 L 512 192 M 0 256 L 512 256 M 0 320 L 512 320 M 0 384 L 512 384 M 0 448 L 512 448" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="16 16" />
  </g>

  <!-- 2. ANA YARIŞ KALKANI (AERODYNAMIC RACING CREST) -->
  <g filter="url(#badgeShadow)">
    
    <!-- Geometrik Agresif Kalkan Dış Kabuğu -->
    <path d="M 256 68 
             L 416 132 
             L 384 340 
             L 256 432 
             L 128 340 
             L 96 132 Z" 
          fill="#0B0F19" 
          stroke="url(#titaniumChrome)" 
          stroke-width="5" 
          stroke-linejoin="round" />

    <!-- Kalkan İçi Kırmızı Apex Hız Dolgusu -->
    <path d="M 256 78 
             L 404 138 
             L 374 332 
             L 256 418 
             L 138 332 
             L 108 138 Z" 
          fill="#111624" />

    <!-- Sağ Üst Kırmızı Dinamik Yarış Yüzeyi -->
    <path d="M 256 78 
             L 404 138 
             L 374 332 
             L 256 418 Z" 
          fill="url(#apexRed)" 
          opacity="0.18" />

    <!-- 3. İKONİK MERKEZ: PİST APEX VİRAJI & STİLİZE YARIŞ MOTİFİ -->
    
    <!-- Dış Dinamik Pist Virajı (Kırmızı / Beyaz Kerb Bordür Çizgisi) -->
    <path d="M 148 184 
             C 210 120, 310 120, 364 184 
             C 400 228, 380 296, 324 332 
             L 256 376 
             L 230 332 
             C 272 304, 290 264, 270 232 
             C 244 192, 188 194, 148 226 Z" 
          fill="url(#apexRed)" 
          filter="url(#neonGlow)" />

    <!-- İç Metalik Hız Bıçağı (Aerodinamik Yarış Kanadı & "P" - Paddock Monogramı) -->
    <path d="M 172 152 
             L 332 152 
             L 348 196 
             L 256 196 
             L 242 248 
             L 316 248 
             L 302 292 
             L 228 292 
             L 194 396 
             L 154 396 
             L 196 248 
             L 164 248 Z" 
          fill="url(#titaniumChrome)" />

    <!-- Hız Çizgileri & Apex Vurguları (Cyan & Altın Rüzgarı) -->
    <path d="M 198 168 L 320 168 L 312 184 L 202 184 Z" fill="#FFFFFF" opacity="0.9" />
    <polygon points="268,260 306,260 298,280 260,280" fill="url(#goldApex)" />

    <!-- İki adet Yarış Şeridi (Damalı Bayrak Vurgusu) -->
    <g transform="translate(196, 102)" opacity="0.85">
      <rect x="0" y="0" width="16" height="12" fill="#FFFFFF" />
      <rect x="32" y="0" width="16" height="12" fill="#FFFFFF" />
      <rect x="64" y="0" width="16" height="12" fill="#FFFFFF" />
      <rect x="96" y="0" width="16" height="12" fill="#FFFFFF" />
      <rect x="16" y="12" width="16" height="12" fill="#FFFFFF" />
      <rect x="48" y="12" width="16" height="12" fill="#FFFFFF" />
      <rect x="80" y="12" width="16" height="12" fill="#FFFFFF" />
    </g>

    <!-- Küçük ve Keskin "UŞAK" Başlığı Kalkanın Üstünde -->
    <text x="256" y="92" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="20" 
          font-weight="900" 
          font-style="italic" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          letter-spacing="6">
      UŞAK
    </text>

    <!-- 4. PADDOCK BOX ALT METAL PLAKA -->
    <g transform="translate(166, 360)">
      <rect x="0" y="0" width="180" height="34" rx="10" fill="#0B0F19" stroke="url(#apexRed)" stroke-width="2.5" />
      <text x="90" y="23" 
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="16" 
            font-weight="900" 
            font-style="italic" 
            fill="url(#goldApex)" 
            text-anchor="middle" 
            letter-spacing="3">
        PADDOCK BOX
      </text>
    </g>
  </g>

  <!-- 5. EN ALT KURUMSAL ŞERİT -->
  <g transform="translate(256, 474)">
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="15" 
          font-weight="900" 
          font-style="italic" 
          fill="#94A3B8" 
          text-anchor="middle" 
          letter-spacing="5">
      MOTORSPORT CIRCUIT
    </text>
  </g>
</svg>